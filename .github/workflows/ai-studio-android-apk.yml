name: Build AI Studio Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ai-studio-hybrid
    paths:
      - "ai-studio/**"
      - ".github/workflows/ai-studio-android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ai-studio

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare bundled AI Studio web assets
        run: |
          mkdir -p www
          cp index.html styles.css app.js manifest.webmanifest sw.js icon.svg www/

      - name: Generate native Android project
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: ai-studio/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moneyprinterturbo-ai-studio-debug-apk
          path: ai-studio/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
